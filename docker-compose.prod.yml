# Production-like stack using the slim, self-contained `prod` image.
#
# Nothing is bind-mounted: dependencies and compiled assets are baked into the
# image at build time. The built public/ directory is shared with nginx through
# a named volume that Docker populates from the image on first start.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# NOTE: the prod image runs with APP_ENV=prod. Set a real APP_SECRET and
# DATABASE_URL (e.g. via an .env.prod.local file or the `environment` block).

services:
  web:
    image: nginx:alpine
    container_name: symfony_web
    restart: unless-stopped
    ports:
      - "1998:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - symfony

  php:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: symfony_php
    restart: unless-stopped
    volumes:
      - public_assets:/var/www/html/public
    networks:
      - symfony

  db:
    image: mysql:8.0
    container_name: symfony_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - symfony

volumes:
  db_data:
  public_assets:

networks:
  symfony:
